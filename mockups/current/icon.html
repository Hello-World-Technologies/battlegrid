<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 512px; height: 512px; overflow: hidden; background: #cfe2f0; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe2f0" />
      <stop offset="100%" stop-color="#eef4e0" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#ffe3ac" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#e6a64a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e6a64a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wood" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#c88a4c" />
      <stop offset="55%" stop-color="#a8672f" />
      <stop offset="100%" stop-color="#5e3416" />
    </radialGradient>
    <radialGradient id="boardShade" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- fully opaque square background, no alpha -->
  <rect x="0" y="0" width="512" height="512" fill="url(#sky)" />
  <rect x="0" y="0" width="512" height="512" fill="url(#glow)" />

  <!-- ground shadow under the medallion -->
  <ellipse cx="256" cy="420" rx="168" ry="30" fill="#3b1f0d" opacity="0.18" />

  <!-- wood ring -->
  <circle cx="256" cy="256" r="230" fill="url(#wood)" stroke="#3b1f0d" stroke-width="7" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#e6bd72" stroke-width="3" opacity="0.5" />
  <circle cx="256" cy="256" r="201" fill="none" stroke="#8a5a2b" stroke-width="6" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#3b1f0d" stroke-width="4" />

  <!-- board -->
  <g stroke="#3b1f0d" stroke-width="6" stroke-linejoin="round">
    <path d="M 256,256 L 91.5,161 A 190,190 0 0 1 420.5,161 Z" fill="#a3a3a3" />
    <path d="M 256,256 L 420.5,161 A 190,190 0 0 1 256,446 Z" fill="#f97057" />
    <path d="M 256,256 L 256,446 A 190,190 0 0 1 91.5,161 Z" fill="#7cc8ff" />
  </g>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#3b1f0d" stroke-width="7" />
  <circle cx="256" cy="256" r="190" fill="url(#boardShade)" />

  <!-- territory badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="256" cy="142" r="46" fill="#fff3d9" stroke="#3b1f0d" stroke-width="7" />
    <text x="256" y="159" font-size="46" fill="#3b1f0d">5</text>

    <circle cx="368" cy="327" r="46" fill="#fff3d9" stroke="#3b1f0d" stroke-width="7" />
    <text x="368" y="344" font-size="46" fill="#3b1f0d">9</text>

    <circle cx="144" cy="327" r="46" fill="#fff3d9" stroke="#3b1f0d" stroke-width="7" />
    <text x="144" y="344" font-size="42" fill="#3b1f0d">12</text>
  </g>

  <!-- center capital marker -->
  <circle cx="256" cy="256" r="13" fill="#fff3d9" stroke="#3b1f0d" stroke-width="5" />
</svg>
</body>
</html>
